<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Navbar glass · esempio consumatore Jello</title>
    <link rel="stylesheet" href="./jello/runtime/jello.css" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="app">
      <!-- GlassSource: opaque, scrolls; the navbar is outside it. -->
      <main class="content" id="content" tabindex="0" aria-labelledby="sectionTitle">
        <header class="top">
          <p class="badge">Dati di esempio · non reali</p>
          <h1 id="sectionTitle">Home</h1>
          <p class="sub">Esempio consumatore del runtime Jello: una navbar in basso sopra contenuto che scorre. Nessun dato proviene da un servizio.</p>
        </header>
        <section class="list" id="list" aria-label="Elementi"></section>
        <p class="end">Fine dell’elenco · l’ultima riga resta leggibile sopra la navbar.</p>
      </main>
      <nav class="tabbar" id="tabbar" aria-label="Sezioni">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button type="button" class="tab" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6"/><path d="M6.5 9.2V20h11V9.2"/></svg><span>Home</span></button>
        <button type="button" class="tab" data-tab="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.4 8.6-2.1 4.7-4.7 2.1 2.1-4.7Z"/></svg><span>Explore</span></button>
        <button type="button" class="tab" data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg><span>Profile</span></button>
      </nav>
      <p class="status" id="status" role="status">Caricamento…</p>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
